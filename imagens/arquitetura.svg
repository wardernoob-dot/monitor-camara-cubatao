<rect x="40" y="695" width="16" height="12" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="62" y="706" class="leg">fonte pública</text>
<rect x="170" y="695" width="16" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/><text x="192" y="706" class="leg">etapa do pipeline</text>
<rect x="318" y="695" width="16" height="12" rx="3" fill="#f0fdf4" stroke="#86efac"/><text x="340" y="706" class="leg">publicação</text>
<rect x="440" y="694" width="26" height="15" rx="7.5" fill="#fde68a" stroke="#f59e0b"/><text x="453" y="705" text-anchor="middle" class="ia">IA</text><text x="474" y="706" class="leg">usa IA só para ler o cabeçalho, fazer OCR e explicar o texto do projeto. O voto nunca vem de IA.</text>
