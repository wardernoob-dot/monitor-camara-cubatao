<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif">
<title id="t">Arquitetura do Voto a Voto</title><desc id="d">Fluxo do pipeline: fontes públicas, nove etapas de processamento no GitHub Actions e publicação no GitHub Pages e no Surge.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".10"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
</defs>
<style>
.t{font-size:13px;font-weight:700;fill:#0f172a}.s{font-size:10.5px;fill:#475569}.lane{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#64748b}
.e{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#ar)}.n{font-size:11px;font-weight:700;fill:#fff}.ia{font-size:9.5px;font-weight:800;fill:#78350f}.leg{font-size:11px;fill:#334155}
</style>
<rect width="1200" height="740" rx="18" fill="url(#bg)"/>
<text x="40" y="34" style="font-size:20px;font-weight:800" fill="#0f172a">Voto a voto: do documento público ao site</text>
<rect x="24" y="62" width="236" height="620" rx="14" fill="#ffffff" fill-opacity=".55" stroke="#e2e8f0"/>
<text x="38" y="82" class="lane">FONTES PÚBLICAS</text>
<rect x="284" y="62" width="612" height="620" rx="14" fill="#ffffff" fill-opacity=".55" stroke="#e2e8f0"/>
<text x="298" y="82" class="lane">GITHUB ACTIONS · python -m camara tudo</text>
<rect x="916" y="62" width="260" height="620" rx="14" fill="#ffffff" fill-opacity=".55" stroke="#e2e8f0"/>
<text x="930" y="82" class="lane">DIFUSÃO</text>
<rect x="40" y="98" width="204" height="74" rx="11" fill="#eff6ff" stroke="#93c5fd" filter="url(#sh)"/>
<text x="54" y="122" class="t">Portal da Câmara</text>
<text x="54" y="140" class="s">Pautas, resumos, projetos</text>
<text x="54" y="154" class="s">e notícias (Plone)</text>
<rect x="40" y="248" width="204" height="74" rx="11" fill="#f5f3ff" stroke="#c4b5fd" filter="url(#sh)"/>
<text x="54" y="272" class="t">Agente Windows</text>
<text x="54" y="290" class="s">pc/pegar_specs.ps1: lê o</text>
<text x="54" y="304" class="s">storyboard do YouTube</text>
<rect x="40" y="398" width="204" height="74" rx="11" fill="#eff6ff" stroke="#93c5fd" filter="url(#sh)"/>
<text x="54" y="422" class="t">TV Câmara no YouTube</text>
<text x="54" y="440" class="s">Miniaturas do painel</text>
<text x="54" y="454" class="s">de votação</text>
<rect x="930" y="98" width="232" height="74" rx="11" fill="#eff6ff" stroke="#93c5fd" filter="url(#sh)"/>
<text x="944" y="122" class="t">Diário Oficial</text>
<text x="944" y="140" class="s">Leis sancionadas</text>
<text x="944" y="154" class="s">e promulgadas</text>
<rect x="300" y="98" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="340" y="122" class="t">coletor.py</text>
<text x="340" y="140" class="s">PDFs e SHA-256 em</text>
<text x="340" y="154" class="s">indice.json</text>
<circle cx="320" cy="136.0" r="11" fill="#4f46e5"/><text x="320" y="140.0" text-anchor="middle" class="n">1</text>
<rect x="500" y="98" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="540" y="122" class="t">processar.py</text>
<text x="540" y="140" class="s">parser_resumo.py: votos</text>
<text x="540" y="154" class="s">→ sessoes/*.json</text>
<circle cx="520" cy="136.0" r="11" fill="#4f46e5"/><text x="520" y="140.0" text-anchor="middle" class="n">2</text>
<rect x="700" y="98" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="740" y="122" class="t">noticias.py</text>
<text x="740" y="140" class="s">diario.py: notícias e</text>
<text x="740" y="154" class="s">leis no Diário Oficial</text>
<circle cx="720" cy="136.0" r="11" fill="#4f46e5"/><text x="720" y="140.0" text-anchor="middle" class="n">5</text>
<rect x="300" y="248" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="340" y="272" class="t">painel.py</text>
<text x="340" y="290" class="s">Cor da moldura + rostos</text>
<text x="340" y="304" class="s">→ painel/*.json</text>
<circle cx="320" cy="286.0" r="11" fill="#4f46e5"/><text x="320" y="290.0" text-anchor="middle" class="n">3</text>
<rect x="500" y="248" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="540" y="272" class="t">cabecalho.py</text>
<text x="540" y="290" class="s">Matéria em votação;</text>
<text x="540" y="304" class="s">validacao.py confere</text>
<circle cx="520" cy="286.0" r="11" fill="#4f46e5"/><text x="520" y="290.0" text-anchor="middle" class="n">4</text>
<rect x="650" y="256" width="26" height="15" rx="7.5" fill="#fde68a" stroke="#f59e0b"/><text x="663" y="267" text-anchor="middle" class="ia">IA</text>
<rect x="700" y="248" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="740" y="272" class="t">consolidar.py</text>
<text x="740" y="290" class="s">Painel × resumo × pauta ×</text>
<text x="740" y="304" class="s">notícia × DO</text>
<circle cx="720" cy="286.0" r="11" fill="#4f46e5"/><text x="720" y="290.0" text-anchor="middle" class="n">6</text>
<rect x="700" y="398" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="740" y="422" class="t">analise.py</text>
<text x="740" y="440" class="s">OCR, "Entenda o projeto",</text>
<text x="740" y="454" class="s">dicas (explicacao.py)</text>
<circle cx="720" cy="436.0" r="11" fill="#4f46e5"/><text x="720" y="440.0" text-anchor="middle" class="n">7</text>
<rect x="850" y="406" width="26" height="15" rx="7.5" fill="#fde68a" stroke="#f59e0b"/><text x="863" y="417" text-anchor="middle" class="ia">IA</text>
<rect x="500" y="548" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="540" y="572" class="t">posts.py</text>
<text x="540" y="590" class="s">Cards 1080×1350 em</text>
<text x="540" y="604" class="s">data/posts/</text>
<circle cx="520" cy="586.0" r="11" fill="#4f46e5"/><text x="520" y="590.0" text-anchor="middle" class="n">8</text>
<rect x="700" y="548" width="184" height="76" rx="11" fill="#ffffff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="740" y="572" class="t">site.py</text>
<text x="740" y="590" class="s">docs/data/dados.json +</text>
<text x="740" y="604" class="s">fotos</text>
<circle cx="720" cy="586.0" r="11" fill="#4f46e5"/><text x="720" y="590.0" text-anchor="middle" class="n">9</text>
<rect x="930" y="498" width="232" height="74" rx="11" fill="#f0fdf4" stroke="#86efac" filter="url(#sh)"/>
<text x="944" y="522" class="t">GitHub Pages</text>
<text x="944" y="540" class="s">Commit do monitor-camara-bot</text>
<text x="944" y="554" class="s">em docs/data/</text>
<rect x="930" y="598" width="232" height="74" rx="11" fill="#f0fdf4" stroke="#86efac" filter="url(#sh)"/>
<text x="944" y="622" class="t">Surge</text>
<text x="944" y="640" class="s">votoavoto.surge.sh</text>
<text x="944" y="654" class="s">npx surge@0.44.7 ./docs</text>
