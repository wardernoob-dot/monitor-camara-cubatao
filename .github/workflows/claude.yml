name: claude

# Claude responde a @claude em issues e PRs e revisa PRs que mexem em codigo de voto.
# Precisa do secret ANTHROPIC_API_KEY e do app https://github.com/apps/claude instalado no repo.
# Nunca commita em data/ (historico e trilha de auditoria): so abre PR para revisao humana.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize]
    paths:
      - "camara/parser_resumo.py"
      - "camara/consolidar.py"
      - "camara/site.py"
      - "camara/posts.py"
      - "camara/painel.py"
      - "prompts/analise.md"
      - "frontend/src/**"

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # @claude em comentario, revisao ou issue: so o dono do repositorio aciona.
  responder:
    if: |
      github.actor == 'wardernoob-dot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Verificar ANTHROPIC_API_KEY
        id: chave
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY ausente; pulando."
            echo "ativa=false" >> "$GITHUB_OUTPUT"
          else
            echo "ativa=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.chave.outputs.ativa == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        if: steps.chave.outputs.ativa == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(python -m pytest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh issue list:*),Bash(gh issue view:*)"
            --append-system-prompt "Siga o CLAUDE.md. Nao altere nem reescreva nada em data/ (trilha de auditoria) nem em .github/workflows/ ou pc/. Mudou o front? Avise que e preciso rodar npm run build e commitar docs/. Nunca commite docs/CNAME. Abra PR, nao commite direto na main. Pedido de foto de vereador: veja fotos/LEIA-ME.md e site.py:preparar_fotos (casa por apelido/nome civil), confira fotos/CREDITOS.md e rode o build para atualizar docs/fotos. Grafia nova de vereador ou quirk de PDF (negrito falso, cirilico): ajuste nomes.py ou parser_resumo.py com teste novo. Texto de tela: aplique a logica da skill clareza-pro-leitor e diga o que mudou para o dono decidir."

  # Revisao automatica de PR que mexe em leitura/exibicao de voto ou em texto de tela.
  revisar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Verificar ANTHROPIC_API_KEY
        id: chave
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY ausente; pulando."
            echo "ativa=false" >> "$GITHUB_OUTPUT"
          else
            echo "ativa=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.chave.outputs.ativa == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.chave.outputs.ativa == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias Python
        if: steps.chave.outputs.ativa == 'true'
        run: pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        if: steps.chave.outputs.ativa == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revise este PR (${{ github.repository }}#${{ github.event.pull_request.number }}) contra as
            "Regras de interpretacao de voto" do CLAUDE.md. Verifique em especial:
            - presente/ausente da lista nunca vira voto contrario ("nao consta");
            - "Aprovacao do Parecer contrario" = voto contra; "Manutencao do Veto" = a favor do veto;
              "rejeicao do Veto" e "Rejeicao do Parecer" do TCE = derrubar;
            - objeto_votado e rotulos continuam coerentes;
            - todo voto mostra a fonte (painel ou resumo oficial); a IA nunca e fonte de fato;
            - nada de ranking ou nota de vereador;
            - se mexeu em frontend/src, docs/ precisa ter sido rebuildado e commitado;
            - docs/CNAME nao pode ser commitado.
            Comente apenas problemas reais, de forma curta, em portugues. Diga o que nao conseguiu verificar.
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(python -m pytest:*),Read,Grep,Glob"
