name: dependabot-merge

# PR do Dependabot: roda os testes (pytest + build do front) e, se passar, faz o merge SO de atualizacao
# patch ou minor. Salto de versao maior (major) fica aberto para voce decidir.
# Se a main ganhar protecao de branch, troque "gh pr merge --squash" por "gh pr merge --auto --squash".
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  testar-e-mesclar:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: |
          pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Build do front
        run: cd frontend && npm ci && npm run build

      - name: Merge (so patch ou minor)
        env:
          TIPO: ${{ steps.meta.outputs.update-type }}
        run: |
          case "$TIPO" in
            version-update:semver-patch|version-update:semver-minor)
              gh pr merge "$PR_URL" --squash ;;
            *)
              echo "Atualizacao '$TIPO': testes passaram, mas o merge fica para decisao humana." ;;
          esac
