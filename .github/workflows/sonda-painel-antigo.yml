name: sonda-painel-antigo

# Manual e so no branch sondagem-2025: testa se o painel aparece nas transmissoes antigas.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --only-binary=:all: -r requirements.txt
      - run: python scripts/sonda_painel_antigo.py
      - name: Salvar resultado no proprio branch
        run: |
          git config user.name  "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git add -f sonda/saida
          git commit -m "sonda: painel em transmissoes antigas" || echo "nada novo"
          git push origin HEAD:sondagem-2025
