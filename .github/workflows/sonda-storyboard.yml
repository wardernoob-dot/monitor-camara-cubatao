name: sonda-storyboard

# Manual: testa se o Actions alcanca o YouTube e salva amostras de storyboard
# no branch "amostras" (nao mistura com os dados oficiais da main).
on:
  workflow_dispatch:
    inputs:
      extras:
        description: "IDs de video extras separados por espaco"
        default: "VsOfCH9nd0A"

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          pip install --only-binary=:all: requests
      - name: Baixar storyboards
        env:
          EXTRAS: ${{ github.event.inputs.extras }}
        run: |
          read -r -a IDS <<< "$EXTRAS"
          python scripts/sonda_storyboard.py "${IDS[@]}"
      - name: Salvar no branch amostras
        run: |
          git config user.name  "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git checkout -B amostras
          git add -f data/storyboard
          git commit -m "amostras: storyboards $(date -u +%Y-%m-%d)" || echo "nada novo"
          git push -f origin amostras
