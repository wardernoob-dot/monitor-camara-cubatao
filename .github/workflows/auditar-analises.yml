# Segunda leitura das analises de projeto: aponta frase errada/sem base com o trecho do documento.
# Roda com push no branch auditoria-analises e grava auditoria/ NO PROPRIO BRANCH (gente decide o que corrigir).
name: auditar-analises

on:
  push:
    branches: [auditoria-analises]
    paths: ["camara/auditoria_analises.py", ".github/workflows/auditar-analises.yml", "auditoria/ALVOS"]

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt
      - name: Auditar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m camara.auditoria_analises $(cat auditoria/ALVOS 2>/dev/null)
      - name: Gravar no branch
        run: |
          git config user.name "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git add auditoria
          git diff --cached --quiet && exit 0
          git commit -m "auditoria: segunda leitura das analises (conferir antes de corrigir)"
          git push origin HEAD:${GITHUB_REF_NAME}
