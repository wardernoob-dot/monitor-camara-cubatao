name: coleta-diaria

on:
  schedule:
    # a cada 4 horas, no minuto 17 (o GitHub pode atrasar alguns minutos)
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Ano inicial da coleta"
        default: "2026"

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Coletar e processar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DESDE: ${{ github.event.inputs.desde || '2026' }}
        run: |
          if [[ ! "$DESDE" =~ ^[0-9]{4}$ ]]; then
            echo "Ano inicial invalido: $DESDE"
            exit 1
          fi
          python -m camara tudo --desde "$DESDE"

      - name: Commit dos dados novos
        run: |
          git config user.name  "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git add docs/data/
            git commit -m "dados: coleta $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Nada novo hoje."
          fi

      # Espelho do site em votoavoto.surge.sh. Publica o docs/ recem-gerado nesta rodada.
      # Sem os secrets SURGE_LOGIN e SURGE_TOKEN o passo e pulado; falha aqui nao derruba a coleta.
      - name: Publicar no Surge
        continue-on-error: true
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "SURGE_TOKEN ausente; pulando."
            exit 0
          fi
          npx --yes surge@0.24.1 ./docs votoavoto.surge.sh
