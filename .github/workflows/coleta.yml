name: coleta-diaria

on:
  schedule:
    # a cada 4 horas, no minuto 17 (o GitHub pode atrasar alguns minutos)
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Ano inicial da coleta"
        default: "2026"

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Coletar e processar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DESDE: ${{ github.event.inputs.desde || '2026' }}
        run: |
          if [[ ! "$DESDE" =~ ^[0-9]{4}$ ]]; then
            echo "Ano inicial invalido: $DESDE"
            exit 1
          fi
          python -m camara tudo --desde "$DESDE"

      - name: Commit dos dados novos
        run: |
          git config user.name  "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git add docs/data/
            git commit -m "dados: coleta $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Nada novo hoje."
          fi

      # Espelho do site em votoavoto.surge.sh. Publica o docs/ recem-gerado nesta rodada.
      # Sem os secrets SURGE_LOGIN e SURGE_TOKEN o passo e pulado; falha aqui nao derruba a coleta.
      - name: Publicar no Surge
        continue-on-error: true
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "SURGE_TOKEN ausente; pulando."
            exit 0
          fi
          npx --yes surge ./docs votoavoto.surge.sh

      # Se qualquer passo acima falhar, abre (ou comenta em) uma issue com o link da rodada.
      - name: Avisar falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          aberta=$(gh issue list --state open --search "coleta falhou in:title" --json number --jq '.[0].number // empty')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "Falhou de novo: $link"
          else
            gh issue create --title "coleta falhou" --body "A coleta-diaria falhou. Log: $link"
          fi
