# Refaz as analises dos projetos de uma vez (ex.: depois de mudar prompts/analise.md), em vez de esperar
# a coleta de 4 em 4 horas fazer 15 por rodada. Manual: Actions > reanalisar > Run workflow.
name: reanalisar

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "maximo de analises novas nesta rodada"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  reanalisar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Analisar e gerar o site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMITE: ${{ github.event.inputs.limite || '80' }}
        run: |
          if [[ ! "$LIMITE" =~ ^[0-9]{1,3}$ ]]; then echo "limite invalido"; exit 1; fi
          python -c "from camara.analise import analisar_tudo; analisar_tudo('data', limite=int('$LIMITE'), limite_ocr=20)"
          python -c "from camara import site; site.exportar('data')"
      - name: Commit
        run: |
          git config user.name  "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git add data/ docs/data/
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -m "dados: analises refeitas com o prompt atual"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && break
            sleep 10
          done
      - name: Publicar no Surge
        continue-on-error: true
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then echo "SURGE_TOKEN ausente; pulando."; exit 0; fi
          npx --yes surge@0.44.7 ./docs votoavoto.surge.sh
