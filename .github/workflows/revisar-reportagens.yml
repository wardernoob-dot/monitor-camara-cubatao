# Revisao das reportagens pelo Gemini (texto mais completo e simples, cada frase com trecho do documento).
# Roda quando alguem faz push no branch revisao-reportagens (ou manualmente, a partir da main).
# Grava reportagens/revisao/ e o OCR novo em data/texto/ NO PROPRIO BRANCH; nada vai pro site sem aprovacao.
name: revisar-reportagens

on:
  push:
    branches: [revisao-reportagens]
    paths: ["reportagens/*.md", "reportagens/fontes/**", "camara/revisao_reportagens.py", ".github/workflows/revisar-reportagens.yml"]
  workflow_dispatch:
    inputs:
      ids:
        description: "ids separados por espaco (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: revisar-reportagens
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt
      - name: Revisar com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IDS: ${{ github.event.inputs.ids }}
        run: python -m camara.revisao_reportagens $IDS
      - name: Gravar no branch
        run: |
          git config user.name "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git add reportagens/revisao data/texto
          git diff --cached --quiet && exit 0
          git commit -m "reportagens: revisao do Gemini (rascunho, conferir antes de publicar)"
          git push origin HEAD:${GITHUB_REF_NAME}
