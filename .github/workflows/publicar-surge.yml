name: publicar-surge

# Publica o site em votoavoto.surge.sh sempre que docs/ mudar na main (front, fotos, textos).
# Regenera docs/data/dados.json a partir de data/ (offline, sem coleta) para nao publicar dado velho.
# A coleta (coleta.yml) ja publica sozinha ao fim de cada rodada.
on:
  push:
    branches: [main]
    paths: ["docs/**", "fotos/**", "camara/site.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt

      - name: Regenerar dados do site
        run: python -c "from pathlib import Path; from camara.site import exportar; exportar(Path('data'))"

      - name: Atualizar docs/data e docs/fotos no GitHub Pages
        run: |
          git config user.name  "monitor-camara-bot"
          git config user.email "monitor-camara-bot@users.noreply.github.com"
          git add docs/data/ docs/fotos/
          if ! git diff --cached --quiet; then
            git commit -m "site: regenera docs/data e docs/fotos"
            git push
          fi

      - name: Publicar no Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "SURGE_TOKEN ausente; pulando."
            exit 0
          fi
          npx --yes surge@0.44.7 ./docs votoavoto.surge.sh
