# Abre o site (docs/) num navegador e falha se achar erro de JS, texto ilegivel (claro e escuro),
# pagina estourando a largura no celular ou imagem quebrada. Tambem confere que o front compila.
name: conferir-tela

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/assets/**", "docs/index.html", "scripts/conferir_tela.py", ".github/workflows/conferir-tela.yml"]
  pull_request:
    paths: ["frontend/**", "scripts/conferir_tela.py"]
  schedule:
    - cron: "41 9 * * 1"   # toda segunda: dado novo tambem pode quebrar tela
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tela:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Front compila (tipos)
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Navegador
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Conferir as paginas
        run: |
          python -m http.server 8765 -d docs >/dev/null 2>&1 &
          sleep 2
          python scripts/conferir_tela.py | tee /tmp/tela.txt
      - name: Avisar falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          corpo="$(printf 'A conferencia de tela achou problema.\n\n```\n%s\n```\n\nRodada: %s' "$(tail -40 /tmp/tela.txt 2>/dev/null)" "$link")"
          aberta=$(gh issue list --state open --search "tela com problema in:title" --json number --jq '.[0].number // empty')
          if [ -n "$aberta" ]; then gh issue comment "$aberta" --body "$corpo"; else gh issue create --title "tela com problema" --body "$corpo"; fi
